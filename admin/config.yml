backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { label: "الوصف", name: "description", widget: "text" }
      - { label: "القياس", name: "size", widget: "string", default: "Free Size" }
      - { label: "السعر بالدينار", name: "price", widget: "number" }
      - { label: "القسم", name: "category", widget: "select", options: ["women", "men", "kids"] }
      - { label: "صور المنتج", name: "images", widget: "list", field: { label: "صورة", name: "image", widget: "image" } }
