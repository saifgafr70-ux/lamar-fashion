<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أزياء لمار - Lamar Fashion</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Identity Widget for Netlify CMS -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-sm border-b border-amber-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Name -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-white shadow-md shadow-amber-500/20">
                        <i class="fa-solid font-bold text-xl fa-crown"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-xl tracking-tight text-gray-900 leading-none">أزياء لمار</h1>
                        <span class="text-xs font-semibold text-amber-600">Lamar Fashion</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-2">
                    <a href="https://www.tiktok.com/@limr103?_r=1&_t=ZS-9AaJqAQNEe5" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-xl bg-gray-100 text-black hover:bg-gray-200 transition-all flex items-center justify-center" title="تيك توك">
                        <i class="fa-brands fa-tiktok text-xl"></i>
                    </a>

                    <button id="cartBtn" onclick="toggleCart()" class="relative p-2.5 rounded-xl bg-amber-50 text-amber-700 hover:bg-amber-100 transition-all">
                        <i class="fa-solid fa-bag-shopping text-xl"></i>
                        <span id="cartCount" class="absolute -top-1 -right-1 bg-amber-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold shadow-sm">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Banner -->
    <section class="max-w-7xl mx-auto px-4 mt-4">
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-amber-900 via-amber-800 to-amber-950 text-white p-6 md:p-8 shadow-xl">
            <div class="relative z-10 max-w-lg">
                <span class="inline-block bg-amber-500/20 backdrop-blur-md text-amber-300 text-xs font-bold px-3 py-1 rounded-full mb-3 border border-amber-500/30">تشكيلة الموسم الجديدة 🔥</span>
                <h2 class="text-2xl md:text-4xl font-extrabold mb-2 leading-tight">أحدث الموديلات العصرية بأفضل الأسعار</h2>
                <p class="text-amber-100/80 text-sm mb-4">خدمة التوصيل متوفرة لكافة محافظات العراق 🇮🇶 (أجور التوصيل 5,000 د.ع)</p>
            </div>
            <i class="fa-solid fa-shirt absolute -left-6 -bottom-6 text-9xl text-white/5 transform -rotate-12 pointer-events-none"></i>
        </div>
    </section>

    <!-- Categories -->
    <section class="max-w-7xl mx-auto px-4 mt-6">
        <div class="flex items-center gap-2 overflow-x-auto pb-2 hide-scrollbar">
            <button onclick="filterCategory('all')" class="cat-btn active px-5 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition-all bg-amber-600 text-white shadow-sm shadow-amber-600/30">الكل</button>
            <button onclick="filterCategory('men')" class="cat-btn px-5 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition-all bg-white text-gray-600 hover:bg-amber-50">رجالي</button>
            <button onclick="filterCategory('women')" class="cat-btn px-5 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition-all bg-white text-gray-600 hover:bg-amber-50">نسائي</button>
            <button onclick="filterCategory('kids')" class="cat-btn px-5 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition-all bg-white text-gray-600 hover:bg-amber-50">أطفال</button>
        </div>
    </section>

    <!-- Products Grid -->
    <main class="max-w-7xl mx-auto px-4 mt-6">
        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
    </main>

    <!-- Image Modal Lightbox (تكبير الصور للزبون) -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/90 hidden flex flex-col justify-between p-4" onclick="closeImageModal()">
        <div class="flex justify-end">
            <button onclick="closeImageModal()" class="text-white text-3xl font-bold p-2"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 flex items-center justify-center relative max-h-[80vh]" onclick="event.stopPropagation()">
            <img id="modalImage" src="" class="max-h-full max-w-full object-contain rounded-lg shadow-2xl">
        </div>
        <div id="modalThumbs" class="flex justify-center gap-2 overflow-x-auto py-2" onclick="event.stopPropagation()"></div>
    </div>

    <!-- Cart Sidebar -->
    <div id="cartModal" class="fixed inset-0 z-50 invisible transition-opacity duration-300">
        <div onclick="toggleCart()" class="absolute inset-0 bg-black/60 backdrop-blur-sm opacity-0 transition-opacity duration-300" id="cartOverlay"></div>
        <div class="absolute inset-y-0 left-0 max-w-full flex">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col transform -translate-x-full transition-transform duration-300" id="cartContent">
                <div class="p-4 border-b flex items-center justify-between bg-amber-50">
                    <div class="flex items-center gap-2 text-amber-900 font-bold text-lg">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span>سلة الشراء</span>
                    </div>
                    <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-white text-gray-500 hover:text-gray-800 flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
                <div class="p-4 border-t bg-gray-50 space-y-2">
                    <div class="flex justify-between items-center text-sm text-gray-600">
                        <span>مجموع المنتجات:</span>
                        <span id="productsSubtotal">0 د.ع</span>
                    </div>
                    <div class="flex justify-between items-center text-sm text-gray-600">
                        <span>أجور التوصيل:</span>
                        <span>5,000 د.ع</span>
                    </div>
                    <div class="flex justify-between items-center font-bold text-lg text-gray-900 pt-2 border-t">
                        <span>المجموع الكلي مع التوصيل:</span>
                        <span id="cartTotal" class="text-amber-600">5,000 د.ع</span>
                    </div>
                    <button onclick="sendWhatsAppOrder()" class="w-full mt-2 py-3.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-green-600/30 transition-all">
                        <i class="fa-brands fa-whatsapp text-2xl"></i>
                        <span>إرسال الطلب عبر الواتساب</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        const products = [
            {
                id: 1,
                title: "فستان سهرة ملكي مطرز بالذهبي",
                description: "فستان سهرة فاخر باللون الأوف وايت مع تطريزات ذهبية وأكمام ملكية مفتوحة.",
                size: "Large (لارج)",
                price: 25000,
                category: "women",
                images: [
                    "https://i.ibb.co/7dfHWfW2/image.jpg"
                ]
            }
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500"><i class="fa-solid fa-shirt text-5xl mb-3 opacity-30"></i><p>لا توجد منتجات معروضة حالياً</p></div>`;
                return;
            }
            grid.innerHTML = items.map(p => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="relative aspect-square overflow-hidden bg-gray-100 group cursor-pointer" onclick="openImageModal(${p.id})">
                            <img src="${p.images[0]}" alt="${p.title}" class="w-full h-full object-cover">
                            <span class="absolute top-2 right-2 bg-black/60 text-white text-[10px] font-bold px-2 py-0.5 rounded-full backdrop-blur-sm">قياس: ${p.size}</span>
                            ${p.images.length > 1 ? `<span class="absolute bottom-2 left-2 bg-black/60 text-white text-[10px] font-bold px-2 py-0.5 rounded-full"><i class="fa-solid fa-images"></i> ${p.images.length} صور</span>` : ''}
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-gray-800 text-sm md:text-base leading-snug">${p.title}</h3>
                            <p class="text-xs text-gray-500 mt-1 line-clamp-2">${p.description}</p>
                            <p class="text-amber-600 font-extrabold text-base mt-2">${p.price.toLocaleString()} د.ع</p>
                        </div>
                    </div>
                    <div class="p-3 pt-0">
                        <button onclick="addToCart(${p.id})" class="w-full py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold rounded-xl text-xs md:text-sm flex items-center justify-center gap-1.5 transition-all">
                            <i class="fa-solid fa-plus"></i> إضافة للسلة
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openImageModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product || !product.images.length) return;

            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const thumbsContainer = document.getElementById('modalThumbs');

            modalImg.src = product.images[0];
            thumbsContainer.innerHTML = product.images.map((img, idx) => `
                <img src="${img}" onclick="document.getElementById('modalImage').src='${img}'" class="w-12 h-12 object-cover rounded-md cursor-pointer border-2 border-white/50 hover:border-amber-500">
            `).join('');

            modal.classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-amber-600', 'text-white', 'shadow-sm', 'shadow-amber-600/30');
                btn.classList.add('bg-white', 'text-gray-600');
            });
            event.target.classList.remove('bg-white', 'text-gray-600');
            event.target.classList.add('bg-amber-600', 'text-white', 'shadow-sm', 'shadow-amber-600/30');

            if (cat === 'all') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);
            if (exist) exist.qty++;
            else cart.push({ ...product, qty: 1 });
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.reduce((acc, i) => acc + i.qty, 0);
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400"><i class="fa-solid fa-basket-shopping text-5xl mb-3 opacity-30"></i><p>السلة فارغة حالياً</p></div>`;
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex items-center gap-3 bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                        <img src="${item.images[0]}" class="w-14 h-14 object-cover rounded-lg">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-xs md:text-sm text-gray-800 truncate">${item.title}</h4>
                            <span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-semibold">${item.size}</span>
                            <p class="text-amber-600 font-bold text-xs mt-1">${(item.price * item.qty).toLocaleString()} د.ع</p>
                        </div>
                        <div class="flex items-center gap-2 bg-white px-2 py-1 rounded-lg border text-xs">
                            <button onclick="changeQty(${item.id}, -1)" class="text-gray-500 font-bold px-1">-</button>
                            <span class="font-bold">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="text-gray-500 font-bold px-1">+</button>
                        </div>
                    </div>
                `).join('');
            }

            const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const delivery = cart.length > 0 ? 5000 : 0;
            const total = subtotal + delivery;

            document.getElementById('productsSubtotal').innerText = subtotal.toLocaleString() + ' د.ع';
            document.getElementById('cartTotal').innerText = total.toLocaleString() + ' د.ع';
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCart();
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            const overlay = document.getElementById('cartOverlay');
            const content = document.getElementById('cartContent');

            if (modal.classList.contains('invisible')) {
                modal.classList.remove('invisible');
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    content.classList.remove('-translate-x-full');
                }, 10);
            } else {
                overlay.classList.add('opacity-0');
                content.classList.add('-translate-x-full');
                setTimeout(() => modal.classList.add('invisible'), 300);
            }
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) return alert('السلة فارغة!');
            
            const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const delivery = 5000;
            const total = subtotal + delivery;

            let text = "مرحباً *أزياء لمار* 🌹\nأود طلب المنتجات التالية:\n\n";
            cart.forEach(i => {
                text += `• ${i.title} (${i.size}) - السعر: ${(i.price * i.qty).toLocaleString()} د.ع\n`;
            });

            text += `\n💵 سعر المنتجات: ${subtotal.toLocaleString()} د.ع`;
            text += `\n🚚 أجور التوصيل: ${delivery.toLocaleString()} د.ع`;
            text += `\n------------------`;
            text += `\n💰 *المجموع الكلي: ${total.toLocaleString()} د.ع*`;
            
            const myPhoneNumber = "9647766320191"; 
            window.open(`https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(text)}`, '_blank');
        }

        renderProducts(products);

        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
